# Record of RelayRemote.xcodeproj's targets and settings. Since RR-533 the
# committed project is the source of truth: its RelayRemote/ and
# RelayRemoteTests/ folders are file-system-synchronised groups, which this
# file does not describe, so do not regenerate the project from it. Keep it in
# step by hand when target settings change. See ios/README.md.
name: RelayRemote
options:
  bundleIdPrefix: com.relayrunner
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RelayRemoteKit:
    path: RelayRemoteKit
  relay-runner:
    path: ..
targets:
  RelayRemote:
    type: application
    platform: iOS
    sources:
      - path: RelayRemote
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.relayrunner.remote
        PRODUCT_NAME: RelayRemote
        INFOPLIST_FILE: RelayRemote/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RelayRemoteKit
      - package: relay-runner
        product: RelayRemoteProtocol
  RelayRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RelayRemoteTests
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.relayrunner.remote.tests
    dependencies:
      - target: RelayRemote
schemes:
  RelayRemote:
    build:
      targets:
        RelayRemote: all
    test:
      targets:
        - RelayRemoteTests
        - package: RelayRemoteKit/RelayRemoteKitTests
