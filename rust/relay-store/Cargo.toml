[package]
name = "relay-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The Python-compatible JSON (insertion-ordered objects, `json.dumps` text)
# and SHA-256 the stores write into their rows and identities.
relay-intents = { path = "../relay-intents" }
# Bundled SQLite: the daemon's databases are shared with the Python daemon on
# the same data root, so neither may depend on the system library's version or
# build options. `backup` is SQLite's online backup, which Graphify uses.
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "backup"] }
