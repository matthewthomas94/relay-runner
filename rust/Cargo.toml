# Relay Runner's Rust workspace (RR-475). scripts/build-dmg.sh builds it in
# release mode and ships each binary in Contents/MacOS of the app bundle.
[workspace]
resolver = "3"
members = ["relay-rs"]
# The speech prototype (RR-479) is a workspace of its own: it is not built into
# the app, and it resolves about a hundred crates the app does not ship.
exclude = ["relay-speech-proto"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
