[package]
name = "relay-speech"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The speech service (RR-481): Kokoro synthesis, AudioQueue playback and the
# coordinator behind docs/specs/speech-service-protocol.md. It is its own
# binary so relay-rs, which every provider hook starts, does not carry ONNX
# Runtime.
[dependencies]
libc = "0.2"
# The phonemiser the user chose after listening to the RR-479 samples. Pinned
# exactly, as the prototype was.
loqui-g2p = "=0.4.0"
# ONNX Runtime on the CPU. `download-binaries` fetches the ort maintainers'
# static build at compile time and checks it against the hash in ort-sys; the
# binary links it statically, so there is no library to bundle or sign.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native"] }
# Already resolved for loqui-g2p.
serde_json = "1"
# voices-v1.0.bin is a NumPy .npz archive.
zip = { version = "=2.4.2", default-features = false }
