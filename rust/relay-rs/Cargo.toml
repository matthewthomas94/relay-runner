[package]
name = "relay-rs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The intent inbox and provider-turn broker the hook shares with the bridge,
# and the Python-compatible JSON both write.
relay-intents = { path = "../relay-intents" }
# Command actions, authorization and the provider gates, shared with the
# daemon (RR-499).
relay-services = { path = "../relay-services" }
# The artifact CLIs (ticket history, rollout, verification and migration) and
# the pathlib helpers the fresh-install port resolves paths with (RR-487).
relay-artifacts = { path = "../relay-artifacts" }
# O_NONBLOCK and ENXIO, for the FIFO the bridge reads.
libc = "0.2"
# Bundled SQLite: the hook shares the intent inbox with the Python bridge and
# must not depend on the system library's version or build options.
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
