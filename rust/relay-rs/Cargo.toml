[package]
name = "relay-rs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# O_NONBLOCK and ENXIO, for the FIFO the bridge reads.
libc = "0.2"
# Bundled SQLite: the hook shares the intent inbox with the Python bridge and
# must not depend on the system library's version or build options.
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
