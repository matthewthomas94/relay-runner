[package]
name = "relay-intents"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Lookaround, which the voice-turn splitter needs as Python's `re` writes it;
# it hands every other pattern to the `regex` crate.
fancy-regex = "0.20"
# Bundled SQLite: the inbox and the turn tables are shared with the Python
# bridge, so neither may depend on the system library's version or options.
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
