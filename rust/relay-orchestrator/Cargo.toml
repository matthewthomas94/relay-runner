[package]
name = "relay-orchestrator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Rust daemon's fourth and fifth parts (RR-497, RR-498): the HTTP server,
# every route of services/orchestrator.py and worker, review and spike
# execution, backed by parts 1-3 and 6. Since the cut-over (RR-500) the app
# bundle ships the binary and the LaunchAgent runs it by default.
[dependencies]
# Python-compatible JSON, SHA-256 and `re` patterns.
relay-intents = { path = "../relay-intents" }
# Tickets, config and the artifact store, lifecycle and retention (parts 1, 2).
relay-artifacts = { path = "../relay-artifacts" }
# The daemon's SQLite stores (part 3).
relay-store = { path = "../relay-store" }
# Notes, personal storage, program status, continuity, General work and
# command authorization (part 6).
relay-services = { path = "../relay-services" }
# Signals, poll and gethostname.
libc = "0.2"
