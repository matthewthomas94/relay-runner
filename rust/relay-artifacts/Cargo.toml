[package]
name = "relay-artifacts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Rust daemon's first part (RR-494): tickets, follow-up proposals, config
# and the project artifact store. A library, so nothing ships until the daemon
# binary does.
[dependencies]
# Python-compatible JSON, SHA-256 and `re` patterns, shared with the hook.
relay-intents = { path = "../relay-intents" }
# Lookaround, which the spike report's next-steps pattern needs.
fancy-regex = "0.20"
# getpwnam for `~user`, as Python's expanduser reads it.
libc = "0.2"
# Bundled SQLite: the follow-up proposal store is shared with the Python
# daemon and must not depend on the system library's version or options.
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
